# docker-compose.prod.yml — local prod-like stack for testing the production image
# before deploying to Coolify.
#
# Usage:
#   1. Copy deploy/.env.production.example to deploy/.env.production and fill values
#   2. From repo root:  docker compose -f deploy/docker-compose.prod.yml up --build
#   3. App on http://localhost:3000  |  Maildev UI on http://localhost:1080
#
# This file is also a useful reference for what services to declare in Coolify.

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bilancarbone
      POSTGRES_PASSWORD: bilancarbone
      POSTGRES_DB: bilancarbone
    volumes:
      - bilan-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bilancarbone']
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to host in prod — only the app talks to it.
    # For local debugging you can uncomment:
    # ports:
    #   - '5432:5432'
    deploy:
      resources:
        limits:
          memory: 512M

  maildev:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - '1080:1080' # Web UI to inspect emails
    # SMTP port stays internal (1025), reachable from app via service name `maildev`
    deploy:
      resources:
        limits:
          memory: 128M

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env.production
    environment:
      # Override host/port to point to the docker network service names
      POSTGRES_PRISMA_URL: 'postgresql://bilancarbone:bilancarbone@postgres:5432/bilancarbone?options=-c%20search_path=public,bilan_carbone,common'
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      CUT_MAIL_HOST: maildev
      CUT_MAIL_PORT: 1025
      RUN_MIGRATIONS: 'true'
      # Set RUN_SEED=true on first run only (then unset to avoid re-seeding)
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          memory: 1500M

volumes:
  bilan-pg-data:
